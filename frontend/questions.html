<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<main>
<h1>Questions</h1>

    <option value="">All difficulties</option><option>Beginner</option><option>Intermediate</option><option>Advanced</option>

<div class="layout">
  <ul id="qlist" class="qlist"></ul>
  <section id="detail" class="card" aria-live="polite"><p class="empty">Select a question to see its details.</p></section>
</div>
